# Конфигурация деплоя на Amvera (docs.amvera.ru → Node.JS Server)
# Сборка и запуск:
#   npm install → npm run build (additionalCommands)
#   запуск: npm start (= next start, слушает 3000)
meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  additionalCommands: npm run build
  artifacts:
    # маска "*" не захватывает папки с точкой в начале — .next нужно явно,
    # иначе next start не находит продакшен-сборку и процесс падает (503)
    "*": /
    ".next": /

run:
  # Слушаем порт платформы $PORT (если Amvera его подставляет), иначе 3000 —
  # так приложение гарантированно совпадает с маршрутизацией ingress
  command: sh -c "next start -p ${PORT:-3000}"
  containerPort: 3000
